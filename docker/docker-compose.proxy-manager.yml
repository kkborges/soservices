name: las-saas

networks:
  las-net:
    external: true

volumes:
  npm_data:
    name: las_npm_data
    external: true
  npm_letsencrypt:
    name: las_npm_letsencrypt
    external: true

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - las-net
