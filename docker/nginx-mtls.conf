upstream nexus_api_cluster {
    least_conn;
    server nexus-api-a:8000 max_fails=3 fail_timeout=15s;
    server nexus-api-b:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 8443 ssl;
    server_name api.soservices.com.br mtls-api.soservices.com.br;

    ssl_certificate /etc/nginx/mtls/api-server.cert.pem;
    ssl_certificate_key /etc/nginx/mtls/api-server.key.pem;
    ssl_client_certificate /etc/nginx/mtls/ca.pem;
    ssl_verify_client optional;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 100M;

    location /api/v1/agents/bootstrap/mtls {
        proxy_pass http://nexus_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location /api/ {
        if ($ssl_client_verify != SUCCESS) {
            return 496;
        }
        proxy_pass http://nexus_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
