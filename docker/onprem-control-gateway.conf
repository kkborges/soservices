[las]
# Control gateway (on-prem -> SaaS)
# Set platform_url to the SaaS public endpoint (not the local on-prem API).
platform_url=https://api.soservices.com.br
gateway_token=
gateway_type=control
host=onprem
port=9443

[mtls]
enabled=true
ca_file=/etc/las/mtls/ca.pem
client_cert_file=/etc/las/mtls/gateway-client.cert.pem
client_key_file=/etc/las/mtls/gateway-client.key.pem
server_cert_file=/etc/las/mtls/gateway-server.cert.pem
server_key_file=/etc/las/mtls/gateway-server.key.pem

[edge]
enabled=true
sync_interval=300

