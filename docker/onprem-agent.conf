[las]
# Agent self-monitoring (on-prem)
platform_url=http://las-api-ha/api
agent_token=
host_alias=las-onprem-platform

[mtls]
enabled=false
ca_file=/etc/las/mtls/ca.pem
client_cert_file=/etc/las/mtls/agent-client.cert.pem
client_key_file=/etc/las/mtls/agent-client.key.pem

[logs]
enabled=true
patterns=/var/log/syslog,/var/log/auth.log,/var/log/nginx/*.log,/var/log/apache2/*.log

