receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  attributes:
    actions:
      - action: insert
        key: collector.name
        value: las-otel-collector

exporters:
  otlp_http/las_traces:
    endpoint: http://las-api:8000/api/v1/ingest/otel/traces
  otlp_http/las_metrics:
    endpoint: http://las-api:8000/api/v1/ingest/otel/metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/las_traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/las_metrics]
