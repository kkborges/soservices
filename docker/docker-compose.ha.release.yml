name: las-saas

networks:
  las-net:
    external: true

services:
  las-api-a:
    image: las-backend-release:latest
    build:
      context: ../backend
      dockerfile: Dockerfile.release
    container_name: las-api-a
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
      POSTGRES_DB: las
      POSTGRES_USER: las
      REDIS_HOST: redis-haproxy
      REDIS_PORT: 6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_MASTER_NAME: lasmaster
      WORKERS: 1
      HA_MODE: active-active
      API_CLUSTER_EXPECTED_REPLICAS: 2
      API_INSTANCE_ID: api-a
      POSTGRES_HA_MODE: pgpool-repmgr
      REDIS_HA_MODE: sentinel
      MTLS_STORAGE_DIR: /app/runtime/mtls
    networks:
      - las-net
    volumes:
      - ../runtime/mtls:/app/runtime/mtls
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  las-api-b:
    image: las-backend-release:latest
    build:
      context: ../backend
      dockerfile: Dockerfile.release
    container_name: las-api-b
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
      POSTGRES_DB: las
      POSTGRES_USER: las
      REDIS_HOST: redis-haproxy
      REDIS_PORT: 6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_MASTER_NAME: lasmaster
      WORKERS: 1
      HA_MODE: active-active
      API_CLUSTER_EXPECTED_REPLICAS: 2
      API_INSTANCE_ID: api-b
      POSTGRES_HA_MODE: pgpool-repmgr
      REDIS_HA_MODE: sentinel
      MTLS_STORAGE_DIR: /app/runtime/mtls
    networks:
      - las-net
    volumes:
      - ../runtime/mtls:/app/runtime/mtls
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  las-frontend-ha:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: las-frontend-ha
    restart: unless-stopped
    volumes:
      - ./nginx-ha.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - las-net
    depends_on:
      - las-api-a
      - las-api-b

  las-api-ha:
    image: nginx:1.27-alpine
    container_name: las-api-ha
    restart: unless-stopped
    volumes:
      - ./nginx-api-ha.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - las-net
    depends_on:
      - las-api-a
      - las-api-b

  # Celery workers are required for synthetic tests, alert engine, baselines and scheduled tasks.
  las-celery-worker:
    image: las-backend-release:latest
    container_name: las-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.workers.celery_app worker --queues=default,alerts,baseline,collector --loglevel=info --concurrency=4
    environment:
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
      POSTGRES_DB: las
      POSTGRES_USER: las
      REDIS_HOST: redis-haproxy
      REDIS_PORT: 6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_MASTER_NAME: lasmaster
      HA_MODE: active-active
      API_CLUSTER_EXPECTED_REPLICAS: 2
      API_INSTANCE_ID: worker-default
      POSTGRES_HA_MODE: pgpool-repmgr
      REDIS_HA_MODE: sentinel
      MTLS_STORAGE_DIR: /app/runtime/mtls
    networks:
      - las-net
    volumes:
      - ../runtime/mtls:/app/runtime/mtls
    depends_on:
      - las-api-a
      - las-api-b

  las-celery-synthetic:
    image: las-backend-release:latest
    container_name: las-celery-synthetic
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.workers.celery_app worker --queues=synthetic --loglevel=info --concurrency=10
    environment:
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
      POSTGRES_DB: las
      POSTGRES_USER: las
      REDIS_HOST: redis-haproxy
      REDIS_PORT: 6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_MASTER_NAME: lasmaster
      HA_MODE: active-active
      API_CLUSTER_EXPECTED_REPLICAS: 2
      API_INSTANCE_ID: worker-synthetic
      POSTGRES_HA_MODE: pgpool-repmgr
      REDIS_HA_MODE: sentinel
      MTLS_STORAGE_DIR: /app/runtime/mtls
    networks:
      - las-net
    volumes:
      - ../runtime/mtls:/app/runtime/mtls
    depends_on:
      - las-api-a
      - las-api-b

  las-celery-beat:
    image: las-backend-release:latest
    container_name: las-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
      POSTGRES_DB: las
      POSTGRES_USER: las
      REDIS_HOST: redis-haproxy
      REDIS_PORT: 6379
      REDIS_SENTINELS: redis-sentinel-0:26379,redis-sentinel-1:26379,redis-sentinel-2:26379
      REDIS_MASTER_NAME: lasmaster
      HA_MODE: active-active
      API_CLUSTER_EXPECTED_REPLICAS: 2
      API_INSTANCE_ID: beat
      POSTGRES_HA_MODE: pgpool-repmgr
      REDIS_HA_MODE: sentinel
      MTLS_STORAGE_DIR: /app/runtime/mtls
    networks:
      - las-net
    volumes:
      - ../runtime/mtls:/app/runtime/mtls
    depends_on:
      - las-api-a
      - las-api-b
