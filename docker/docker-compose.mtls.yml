networks:
  las-net:
    external: true

services:
  las-mtls-edge:
    image: nginx:1.27-alpine
    container_name: las-mtls-edge
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx-mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ../runtime/mtls:/etc/nginx/mtls:ro
    networks:
      - las-net
