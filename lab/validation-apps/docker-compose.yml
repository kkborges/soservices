services:
  dotnet-sample:
    build: ./dotnet-sample
    container_name: las-validation-dotnet
    ports:
      - "5081:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080

  java-sample:
    build: ./java-sample
    container_name: las-validation-java
    ports:
      - "5082:8080"

  php-sample:
    build: ./php-html-sample
    container_name: las-validation-php
    ports:
      - "5083:80"
