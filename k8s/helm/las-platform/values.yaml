# Default values for LAS Platform (Kubernetes/Helm).
#
# This chart focuses on stateless components (API + Frontend + Ingress).
# For production, prefer managed PostgreSQL/Redis or operators.
#
# Notes:
# - Browser users do NOT use mTLS.
# - Agents/Gateways SHOULD use mTLS (see mtlsIngress.* below).

namespaceOverride: ""

images:
  api:
    # These images are NOT published publicly. Build and push them to a registry
    # reachable by every Kubernetes node, then override this value.
    repository: las-backend-release
    tag: "4.1.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: las-frontend
    tag: "4.1.0"
    pullPolicy: IfNotPresent

# Example:
# imagePullSecrets:
#   - name: regcred
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  # Grants read-only Kubernetes API access required by collect_k8s_metrics.
  k8sCollector:
    enabled: false

replicas:
  api: 2
  frontend: 2
  worker: 1
  beat: 1

resources:
  api: {}
  frontend: {}
  worker: {}
  beat: {}

postgresql:
  enabled: true
  image: postgres:16-alpine
  storage: 20Gi
  storageClassName: microk8s-hostpath

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  storageClassName: microk8s-hostpath

env:
  # Database (external or in-cluster)
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "las"
  POSTGRES_USER: "las"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # Redis
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGE_ME"

  # App secrets
  SECRET_KEY: "CHANGE_ME_TO_A_64_CHAR_RANDOM_STRING"
  DEBUG: "false"

  # Public URLs (used in links and onboarding)
  PUBLIC_WEB_URL: "https://las.example.com"
  PLATFORM_URL: "https://api.example.com"

  # mTLS enforcement for agent/gateway control endpoints.
  # Keep true in production behind an mTLS-capable edge/Ingress.
  # Set false only for isolated homologation deploys exposed by NodePort.
  MTLS_ENABLED: "true"
  MTLS_REQUIRED: "true"
  MTLS_PLATFORM_URL: "https://mtls-api.example.com"

  # Kubernetes collector. Enable when the worker runs inside a cluster and
  # the service account has read access to pods, nodes and deployments.
  K8S_IN_CLUSTER: "false"
  KUBECONFIG_PATH: ""

  # Optional AI providers
  AI_PROVIDER: "openai"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""

service:
  api:
    type: ClusterIP
    port: 8000
    nodePort: null
  frontend:
    type: ClusterIP
    port: 80
    nodePort: null

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    web: "las.example.com"
    api: "api.example.com"
  tls:
    enabled: false
    secretNameWeb: ""
    secretNameApi: ""

# mTLS for agent/gateway traffic.
# Implementation option: NGINX Ingress Controller with auth-tls annotations.
# If you don't use NGINX Ingress, disable this and place an mTLS edge/load-balancer in front.
mtlsIngress:
  enabled: false
  className: "nginx"
  host: "mtls-api.example.com"
  # A secret containing CA for client cert verification (must include ca.crt).
  clientCaSecretName: "las-mtls-client-ca"
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "2"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  tls:
    enabled: false
    secretName: ""

nodeSelector: {}
tolerations: []
affinity: {}
