apiVersion: v1
kind: Secret
metadata:
  name: {{ include "las.fullname" . }}-env
  namespace: {{ include "las.namespace" . }}
  labels:
    {{- include "las.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ default (printf "%s-postgres" (include "las.fullname" .)) .Values.env.POSTGRES_HOST | quote }}
  POSTGRES_PORT: {{ .Values.env.POSTGRES_PORT | quote }}
  POSTGRES_DB: {{ .Values.env.POSTGRES_DB | quote }}
  POSTGRES_USER: {{ .Values.env.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ .Values.env.POSTGRES_PASSWORD | quote }}
  REDIS_HOST: {{ default (printf "%s-redis" (include "las.fullname" .)) .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  REDIS_DB: {{ default "0" .Values.env.REDIS_DB | quote }}
  REDIS_PASSWORD: {{ .Values.env.REDIS_PASSWORD | quote }}
  SECRET_KEY: {{ .Values.env.SECRET_KEY | quote }}
  DEBUG: {{ .Values.env.DEBUG | quote }}
  PUBLIC_WEB_URL: {{ .Values.env.PUBLIC_WEB_URL | quote }}
  PLATFORM_URL: {{ .Values.env.PLATFORM_URL | quote }}
  AI_PROVIDER: {{ .Values.env.AI_PROVIDER | quote }}
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | quote }}
  ANTHROPIC_API_KEY: {{ .Values.env.ANTHROPIC_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.env.GEMINI_API_KEY | quote }}
