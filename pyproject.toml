"""
Pytest configuration file
Run tests with: pytest
"""

# ====== PYTEST CONFIGURATION ======

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add current options
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=html",
    "--cov-report=term",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "-p no:warnings",
]

# Markers for organizing tests
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires services)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow running tests",
    "db: Tests requiring database",
    "cache: Tests requiring cache",
    "external: Tests with external API calls",
]

# Coverage options
[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "app/main.py",
    "app/core/config.py",
    "*/venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*Protocol.*:",
]

precision = 2
show_missing = true

[tool.coverage.html]
directory = "coverage_html"

# ====== BLACK CONFIGURATION ======

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# ====== ISORT CONFIGURATION ======

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

# ====== MYPY CONFIGURATION ======

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

# ====== PYLINT CONFIGURATION ======

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W1203",  # logging-fstring-interpolation
    "C0103",  # invalid-name
]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.variables]
additional-builtins = ["_"]

# ====== PROJECT METADATA ======

[project]
name = "nexus-api"
version = "3.0.0"
description = "LAS Platform - Observability and Monitoring"
